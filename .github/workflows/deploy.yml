name: Deploy to GitHub Pages

# Publishes the static site to GitHub Pages on every push.
# The "Setup Pages" step below enables Pages automatically (enablement: true),
# so no manual repository setting is required. If your organization blocks
# automatic enablement, set Settings > Pages > "Build and deployment" >
# "Source" to "GitHub Actions" once, and the workflow takes over from there.

on:
  push:
    branches: ["claude/website-creation-oiseqj", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deploy at a time; let a newer push cancel an in-progress run.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
