name: Deploy to GitHub Pages

# Publishes the static site to GitHub Pages on every push.
#
# ONE-TIME SETUP (required, do this once): in the repository on GitHub, open
# Settings > Pages, and under "Build and deployment" set "Source" to
# "GitHub Actions". Until that is set, this workflow fails at "Setup Pages"
# with "Get Pages site failed: Not Found", because the site does not exist
# yet and the built-in Actions token is not allowed to create it. Once the
# source is set, re-run this workflow (or push again) and it deploys.

on:
  push:
    branches: ["claude/website-creation-oiseqj", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deploy at a time; let a newer push cancel an in-progress run.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
